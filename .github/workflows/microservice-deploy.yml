name: Microservice Deploy

on:
  push:
    branches:
      - microservice-refactor
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    

env:
  IMAGE_NAME: baoleme-backend-microservice:${{ github.sha }}
  IMAGE_NAME_LATEST: baoleme-backend-microservice:latest

defaults:
  run:
    shell: pwsh

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: |
        docker build . --file Dockerfile --tag $env:IMAGE_NAME
        docker image tag $env:IMAGE_NAME $env:IMAGE_NAME_LATEST
    
    - name: Prepare environment
      run: cp docker-compose.env scripts/docker-compose.env

    - name: Run Docker compose
      run: |
        docker compose -f scripts/ci-compose.yml up -d --wait
    - name: Run tests
      run: |
        docker container exec baoleme-backend-microservice:latest npm run test:unit
    - name: Save Docker image
      run: |
        docker image save $env:IMAGE_NAME_LATEST | gzip > baoleme-backend-microservice.tar.gz
    - name: Upload Docker image
      uses: actions/upload-artifact@v4
      with:
        name: baoleme-backend-microservice
        path: baoleme-backend-microservice.tar.gz

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Download Docker image
      uses: actions/download-artifact@v4
      with:
        name: baoleme-backend-microservice
    - name: Upload files to server
      uses: wlixcc/SFTP-Deploy-Action@v1.2.6
      with:
        username: ${{ vars.SSH_USER }}
        server: ${{ vars.SSH_HOST }}
        port: ${{ vars.SSH_PORT }}
        ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
        local_path: './baoleme-backend-microservice.tar.gz;./docker-compose.yml;./docker-compose.env;k8s.yaml'
        remote_path: /home/ci/deploy
    - name: Restart backend service
      uses: appleboy/ssh-action@v1
      with:
        username: ${{ vars.SSH_USER }}
        host: ${{ vars.SSH_HOST }}
        port: ${{ vars.SSH_PORT }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd /home/ci/deploy
          docker image load -i baoleme-backend-microservice.tar.gz
          docker compose up --wait

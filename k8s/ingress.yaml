#########################################################
# 统一API路由配置 - baoleme.xyz/api/
# API Gateway处理所有API请求，内部路由到对应微服务
#########################################################
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: baoleme-api-ingress
  annotations:
    # 移除rewrite，保持原始路径
    # traefik.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: traefik
  rules:
  - host: baoleme.xyz
    http:
      paths:
      # API Gateway - 处理所有API请求
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: api
            port:
              number: 3000

---
#########################################################
# MinIO管理控制台单独路由
#########################################################
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: minio-console-ingress
spec:
  ingressClassName: traefik
  rules:
  - host: minio.baoleme.xyz
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: minio
            port:
              number: 9001

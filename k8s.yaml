#########################################################
# Database Secrets
#########################################################
apiVersion: v1
kind: Secret
metadata:
  name: auth-db-credentials
type: Opaque
data:
  POSTGRES_USER: YXV0aHVzZXI=     # base64 encoded "authuser"
  POSTGRES_PASSWORD: YXV0aHBhc3M=  # base64 encoded "authpass"
---
apiVersion: v1
kind: Secret
metadata:
  name: mail-db-credentials
type: Opaque
data:
  POSTGRES_USER: bWFpbHVzZXI=     # base64 encoded "mailuser"
  POSTGRES_PASSWORD: bWFpbHBhc3M=  # base64 encoded "mailpass"
---
apiVersion: v1
kind: Secret
metadata:
  name: address-db-credentials
type: Opaque
data:
  POSTGRES_USER: YWRkcmVzc3VzZXI=     # base64 encoded "addressuser"
  POSTGRES_PASSWORD: YWRkcmVzc3Bhc3M=  # base64 encoded "addresspass"
---
#########################################################
# Common Environment variables ConfigMap
#########################################################
apiVersion: v1
kind: ConfigMap
metadata:
  name: common-env
data:
  NAMESPACE: ""
  LOGLEVEL: info
  SERVICEDIR: services
  TRANSPORTER: nats://nats:4222
  


---
#########################################################
# Ingress for Moleculer API Gateway
#########################################################
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress
  #annotations:
  #  kubernetes.io/ingress.class: nginx
spec:
  rules:
  - host: api.baoleme.xyz
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api
            port:
              number: 3000

---
#########################################################
# API Gateway service
#########################################################
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  selector:
    matchLabels:
      app: api
  replicas: 1
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: api
        image: baoleme-backend-microservices:latest
        imagePullPolicy: Never
        envFrom:
        - configMapRef:
            name: common-env
        env:
          - name: SERVICES
            value: api
          - name: port
            value: "3000"
        ports:
        - containerPort: 3000
        resources:
          limits:
            cpu: "300m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
---
#########################################################
# Service for Moleculer API Gateway service
#########################################################
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
  - port: 3000
    targetPort: 3000
---
# ==============================
# HPA 动态伸缩 资源限制
# ==============================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
---
#########################################################
# auth service
#########################################################
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
spec:
  selector:
    matchLabels:
      app: auth
  replicas: 1
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
      - name: auth
        image: baoleme-backend-microservices:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: common-env
        env:
          - name: SERVICES
            value: "auth"
          - name: POSTGRES_DB
            value: "authdb"
          - name: POSTGRES_USER
            valueFrom:
              secretKeyRef:
                name: auth-db-credentials
                key: POSTGRES_USER
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: auth-db-credentials
                key: POSTGRES_PASSWORD
          - name: POSTGRES_HOST
            value: "postgres-auth"
        resources:
          limits:
            cpu: "200m"
            memory: "128Mi"
          requests:
            cpu: "100m"
            memory: "64Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: auth
spec:
  selector:
    app: auth
  ports:
  - port: 3000
    targetPort: 3000
---
# ========================
# Auth service HPA
# ========================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: auth-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: auth
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
---
# ########################
# Auth PostgreSQL Deployment
# ########################
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-auth
  template:
    metadata:
      labels:
        app: postgres-auth
    spec:
      containers:
      - name: postgres-auth
        image: postgres:17
        env:
        - name: POSTGRES_DB
          value: "authdb"
        - name: POSTGRES_USER
          value: "authuser"
        - name: POSTGRES_PASSWORD
          value: "authpass"
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: postgres-auth-data
          mountPath: /var/lib/postgresql/data
        resources:
          limits:
            cpu: "200m"
            memory: "128Mi"
          requests:
            cpu: "100m"
            memory: "64Mi"
      volumes:
      - name: postgres-auth-data
        persistentVolumeClaim:
          claimName: postgres-auth-pvc

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-auth-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-auth
spec:
  selector:
    app: postgres-auth
  ports:
  - port: 5432
    targetPort: 5432

